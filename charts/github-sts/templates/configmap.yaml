{{- include "github-sts.validateTls" . -}}
{{- include "github-sts.validateApps" . -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "github-sts.fullname" . }}-config
  labels:
    {{- include "github-sts.labels" . | nindent 4 }}
data:
  config.yaml: |
    bundle_enforcement: {{ .Values.bundleEnforcement | quote }}

    server:
      host: "0.0.0.0"
      port: {{ .Values.service.targetPort }}
      log_level: {{ .Values.logging.level | lower | quote }}
      suppress_health_logs: {{ .Values.logging.suppressHealthLogs }}
      shutdown_timeout: {{ .Values.server.shutdownTimeout | default "10s" | quote }}
      trust_forwarded_headers: {{ .Values.server.trustForwardedHeaders | default false }}
      {{- if .Values.tls.enabled }}
      tls:
        cert_file: {{ include "github-sts.tlsPath" (dict "ctx" $ "key" .Values.tls.certKey) | quote }}
        key_file: {{ include "github-sts.tlsPath" (dict "ctx" $ "key" .Values.tls.keyKey) | quote }}
        {{- if .Values.tls.clientAuth.enabled }}
        client_ca_file: {{ include "github-sts.tlsPath" (dict "ctx" $ "key" .Values.tls.clientAuth.caKey) | quote }}
        {{- end }}
        min_version: {{ .Values.tls.minVersion | toString | quote }}
        {{- with .Values.tls.cipherSuites }}
        cipher_suites:
        {{- range . }}
          - {{ . | quote }}
        {{- end }}
        {{- end }}
        {{- with .Values.tls.reloadInterval }}
        reload_interval: {{ . | quote }}
        {{- end }}
      {{- end }}

    {{- if .Values.github.apps }}
    apps:
      {{- range $appName, $appConfig := .Values.github.apps }}
      {{- $instances := include "github-sts.appInstances" (dict "name" $appName "app" $appConfig) | fromYamlArray }}
      {{ $appName }}:
        {{- if $appConfig.instances }}
        {{- /* Pooled app: one physical GitHub App per instance, each with its
        own rate-limit bucket. The server round-robins across them and fails
        over on a retryable error. */}}
        instances:
          {{- range $instances }}
          - name: {{ .name | quote }}
            app_id: {{ .appId | int64 }}
            private_key_path: {{ .keyPath | quote }}
          {{- end }}
        {{- with $appConfig.rotation }}
        rotation:
          {{- with .strategy }}
          strategy: {{ . | quote }}
          {{- end }}
          {{- with .minRemainingPct }}
          min_remaining_pct: {{ . }}
          {{- end }}
          {{- with .maxAttempts }}
          max_attempts: {{ . | int64 }}
          {{- end }}
        {{- end }}
        {{- else }}
        {{- range $instances }}
        app_id: {{ .appId | int64 }}
        private_key_path: {{ .keyPath | quote }}
        {{- end }}
        {{- end }}
        {{- if $appConfig.orgPolicyRepo }}
        org_policy_repo: {{ $appConfig.orgPolicyRepo | quote }}
        {{- end }}
        {{- with $appConfig.policyResolution }}
        policy_resolution: {{ . | quote }}
        {{- end }}
      {{- end }}
    {{- end }}

    oidc:
      {{- if .Values.oidc.allowedIssuers }}
      allowed_issuers:
      {{- range .Values.oidc.allowedIssuers }}
        - {{ . | quote }}
      {{- end }}
      {{- else }}
      allowed_issuers: []
      {{- end }}
      required_audience: {{ .Values.oidc.requiredAudience | default "" | quote }}
      {{- with .Values.oidc.trustedJwksHosts }}
      trusted_jwks_hosts:
        {{- toYaml . | nindent 8 }}
      {{- end }}

    jti:
      backend: {{ .Values.jti.backend | quote }}
      {{- if .Values.jti.redisUrl }}
      redis_url: {{ .Values.jti.redisUrl | quote }}
      {{- end }}
      ttl: {{ .Values.jti.ttl | default "1h" | quote }}

    policy:
      base_path: {{ .Values.policy.basePath | quote }}
      cache_ttl: {{ .Values.policy.cacheTtl | default "60s" | quote }}

    {{- with .Values.bundles }}
    bundles:
      {{- toYaml . | nindent 6 }}
    {{- end }}

    audit:
      file_enabled: {{ .Values.audit.fileEnabled }}
      file_path: {{ .Values.audit.filePath | quote }}
      buffer_size: {{ .Values.audit.bufferSize | default 1024 | int }}

    metrics:
      enabled: {{ .Values.metrics.enabled }}
      {{- if .Values.metrics.authToken }}
      auth_token: {{ .Values.metrics.authToken | quote }}
      {{- end }}
      rate_limit_poll_enabled: {{ .Values.metrics.rateLimitPoll.enabled }}
      rate_limit_poll_interval: {{ .Values.metrics.rateLimitPoll.interval | default "60s" | quote }}
      reachability_probe_enabled: {{ .Values.metrics.reachabilityProbe.enabled }}
      reachability_probe_interval: {{ .Values.metrics.reachabilityProbe.interval | default "30s" | quote }}

    rate_limit:
      enabled: {{ .Values.rateLimit.enabled | default false }}
      rate: {{ .Values.rateLimit.rate | default 10 }}
      burst: {{ .Values.rateLimit.burst | default 20 | int }}
      {{- if .Values.rateLimit.exemptCidrs }}
      exempt_cidrs:
      {{- range .Values.rateLimit.exemptCidrs }}
        - {{ . | quote }}
      {{- end }}
      {{- else }}
      exempt_cidrs: []
      {{- end }}
