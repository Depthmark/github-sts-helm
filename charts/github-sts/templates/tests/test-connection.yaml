{{- if include "github-sts.renderTests" . }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "github-sts.fullname" . }}-test-health
  labels:
    {{- include "github-sts.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: health-check
      image: {{ .Values.tests.image | quote }}
      command:
        - /bin/sh
        - -c
        - |
          {{- include "github-sts.testFetch" (dict "ctx" $ "path" "/health") | nindent 10 }}
          echo "Response: ${RESPONSE}"
          echo "${RESPONSE}" | grep -q '"status"' || exit 1
          echo "Health check passed"
{{- end }}
