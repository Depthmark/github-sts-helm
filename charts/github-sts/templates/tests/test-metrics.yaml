{{- if and .Values.metrics.enabled (include "github-sts.renderTests" .) }}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "github-sts.fullname" . }}-test-metrics
  labels:
    {{- include "github-sts.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: metrics-check
      image: {{ .Values.tests.image | quote }}
      command:
        - /bin/sh
        - -c
        - |
          {{- include "github-sts.testFetch" (dict "ctx" $ "path" "/metrics") | nindent 10 }}
          echo "${RESPONSE}" | grep -q 'githubsts_' || exit 1
          echo "Metrics check passed"
{{- end }}
