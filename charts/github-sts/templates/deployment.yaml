{{- include "github-sts.validateTls" . -}}
{{- include "github-sts.validateApps" . -}}
{{- include "github-sts.validateEndpointAuth" . -}}
{{- include "github-sts.validateCloudIdentities" . -}}
{{- include "github-sts.validateSignerImage" . -}}
{{- $azure := include "github-sts.azureSignerEnabled" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "github-sts.fullname" . }}
  labels:
    {{- include "github-sts.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  {{- with .Values.revisionHistoryLimit }}
  revisionHistoryLimit: {{ . }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "github-sts.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "github-sts.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "github-sts.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      {{- with .Values.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: {{ include "github-sts.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: {{ include "github-sts.portName" . }}
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          env:
            - name: GITHUBSTS_CONFIG_PATH
              value: "/etc/github-sts/config.yaml"
            {{- if include "github-sts.healthEndpointAuthEnabled" . }}
            - name: GITHUBSTS_HEALTH_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "github-sts.endpointAuthSecretName" . }}
                  key: {{ .Values.endpointAuth.healthKey }}
                  optional: true
            {{- end }}
            {{- if include "github-sts.metricsEndpointAuthEnabled" . }}
            - name: GITHUBSTS_METRICS_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "github-sts.endpointAuthSecretName" . }}
                  key: {{ .Values.endpointAuth.metricsKey }}
                  optional: true
            {{- end }}
            {{- if and .Values.tracing.enabled .Values.tracing.headersSecret.name }}
            {{- /* OTLP collector credentials travel through the environment,
            not the ConfigMap: `tracing.headers` in the rendered config would be
            readable by any holder of `get configmaps`. The server leaves its own
            headers field unset, so the SDK picks this variable up. Changing the
            Secret does not roll the pods — the config checksum annotation does
            not cover it — so restart the Deployment after rotating the key. */}}
            - name: OTEL_EXPORTER_OTLP_HEADERS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.tracing.headersSecret.name }}
                  key: {{ .Values.tracing.headersSecret.key }}
            {{- end }}
            {{- if $azure }}
            {{- /* Read by the Azure SDK, not from the config file: the path of
            the token github-sts exchanges for each cloud identity. The client
            and tenant IDs are in the ConfigMap, so nothing else is needed, and
            the Azure workload identity webhook never overwrites a variable the
            container already sets. */}}
            - name: AZURE_FEDERATED_TOKEN_FILE
              value: {{ printf "%s/token" (include "github-sts.azureTokenDir" .) | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if .Values.probes.startup.enabled }}
          startupProbe:
            {{- include "github-sts.probeAction" (dict "ctx" $ "path" "/ready") | nindent 12 }}
            initialDelaySeconds: {{ .Values.probes.startup.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.startup.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          {{- end }}
          {{- if .Values.probes.readiness.enabled }}
          readinessProbe:
            {{- include "github-sts.probeAction" (dict "ctx" $ "path" "/ready") | nindent 12 }}
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          {{- end }}
          {{- if .Values.probes.liveness.enabled }}
          livenessProbe:
            {{- include "github-sts.probeAction" (dict "ctx" $ "path" "/health" "headerToken" .Values.endpointAuth.healthToken) | nindent 12 }}
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: config
              mountPath: /etc/github-sts
              readOnly: true
            {{- if .Values.tls.enabled }}
            - name: tls
              mountPath: {{ .Values.tls.mountPath | quote }}
              readOnly: true
            {{- end }}
            {{- if .Values.audit.fileEnabled }}
            - name: audit-log
              mountPath: {{ dir .Values.audit.filePath }}
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
            {{- if $azure }}
            - name: azure-federated-token
              mountPath: {{ include "github-sts.azureTokenDir" . }}
              readOnly: true
            {{- end }}
            {{- range $appName, $appConfig := .Values.github.apps }}
            {{- if include "github-sts.appMountsKeys" (dict "name" $appName "app" $appConfig) }}
            - name: github-app-{{ $appName }}-key
              mountPath: /etc/github-sts/apps/{{ $appName }}
              readOnly: true
            {{- end }}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: config
          configMap:
            name: {{ include "github-sts.fullname" . }}-config
        {{- if .Values.tls.enabled }}
        {{- /* Projected rather than two Secret volumes: the client CA may live
        in a different Secret, and one mount keeps every file at a path the
        rendered config can name without a second mountPath value. */}}
        - name: tls
          projected:
            sources:
              - secret:
                  name: {{ .Values.tls.existingSecret }}
                  items:
                    - key: {{ .Values.tls.certKey }}
                      path: {{ .Values.tls.certKey }}
                    - key: {{ .Values.tls.keyKey }}
                      path: {{ .Values.tls.keyKey }}
              {{- if .Values.tls.clientAuth.enabled }}
              - secret:
                  name: {{ include "github-sts.clientCASecret" . }}
                  items:
                    - key: {{ .Values.tls.clientAuth.caKey }}
                      path: {{ .Values.tls.clientAuth.caKey }}
              {{- end }}
        {{- end }}
        {{- if .Values.audit.fileEnabled }}
        - name: audit-log
          emptyDir:
            sizeLimit: 100Mi
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
        {{- if $azure }}
        {{- /* Projected by the chart rather than injected by the Azure workload
        identity webhook, so the same values work on any cluster whose issuer
        Microsoft Entra ID can read. The token is minted for Entra's audience
        only, which the Kubernetes API server rejects, so this is not the API
        credential `automountServiceAccountToken` keeps out of the pod. The
        kubelet rotates it at 80% of its hour. */}}
        - name: azure-federated-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: "api://AzureADTokenExchange"
                  expirationSeconds: 3600
                  path: token
        {{- end }}
        {{- range $appName, $appConfig := .Values.github.apps }}
        {{- if include "github-sts.appMountsKeys" (dict "name" $appName "app" $appConfig) }}
        {{- $instances := include "github-sts.appInstances" (dict "name" $appName "app" $appConfig) | fromYamlArray }}
        - name: github-app-{{ $appName }}-key
          {{- if $appConfig.instances }}
          {{- /* Projected rather than a Secret volume: a pool's instances each
          hold their key in their own Secret, and every member has to land under
          the single mount the app already owns. Each instance gets an
          `<appId>/` subdirectory, so two instances can reuse the same key name
          without colliding. */}}
          projected:
            sources:
              {{- range $instances }}
              - secret:
                  name: {{ .existingSecret }}
                  items:
                    - key: {{ .secretKey }}
                      path: {{ .relPath }}
              {{- end }}
          {{- else }}
          {{- range $instances }}
          secret:
            secretName: {{ .existingSecret }}
            items:
              - key: {{ .secretKey }}
                path: {{ .relPath }}
          {{- end }}
          {{- end }}
        {{- end }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
