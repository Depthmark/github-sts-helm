{{- if .Values.httproute.enabled }}
{{- if not .Values.httproute.paths }}
{{- fail "httproute.paths must list at least one match — Gateway API reads a rule with no matches as matching every path, which would publish /health, /ready and /metrics alongside the exchange endpoint" }}
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "github-sts.fullname" . }}
  labels:
    {{- include "github-sts.labels" . | nindent 4 }}
  {{- with .Values.httproute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- range .Values.httproute.parentRefs }}
    - name: {{ .name }}
      {{- if .kind }}
      kind: {{ .kind }}
      {{- end }}
      {{- if .group }}
      group: {{ .group }}
      {{- end }}
      {{- if .namespace }}
      namespace: {{ .namespace }}
      {{- end }}
      {{- if .sectionName }}
      sectionName: {{ .sectionName }}
      {{- end }}
    {{- end }}
  hostnames:
    {{- range .Values.httproute.hostnames }}
    - {{ . | quote }}
    {{- end }}
  rules:
    - matches:
        {{- range .Values.httproute.paths }}
        - path:
            type: {{ .type | default "PathPrefix" }}
            value: {{ .path | quote }}
        {{- end }}
      backendRefs:
        - name: {{ include "github-sts.fullname" . }}
          port: {{ .Values.httproute.port }}
{{- end }}
