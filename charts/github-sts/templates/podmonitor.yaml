{{- if .Values.podMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ include "github-sts.fullname" . }}
  {{- if .Values.podMonitor.namespace }}
  namespace: {{ .Values.podMonitor.namespace }}
  {{- end }}
  labels:
    {{- include "github-sts.labels" . | nindent 4 }}
    {{- with .Values.podMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.podMonitor.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "github-sts.selectorLabels" . | nindent 6 }}
  {{- if .Values.podMonitor.namespace }}
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  {{- end }}
  podMetricsEndpoints:
    - port: {{ include "github-sts.portName" . }}
      path: {{ .Values.podMonitor.path }}
      {{- if .Values.podMonitor.scheme }}
      scheme: {{ .Values.podMonitor.scheme }}
      {{- else if .Values.tls.enabled }}
      scheme: https
      {{- end }}
      {{- if .Values.podMonitor.tlsConfig }}
      tlsConfig:
        {{- toYaml .Values.podMonitor.tlsConfig | nindent 8 }}
      {{- else if .Values.tls.enabled }}
      {{- /* Prometheus scrapes the Pod IP, which a serving certificate issued
      for the Service/ingress hostname has no SAN for. Override with
      `podMonitor.tlsConfig` to verify the target properly. */}}
      tlsConfig:
        insecureSkipVerify: true
      {{- end }}
      interval: {{ .Values.podMonitor.interval }}
      scrapeTimeout: {{ .Values.podMonitor.scrapeTimeout }}
      honorLabels: {{ .Values.podMonitor.honorLabels }}
      {{- with .Values.podMonitor.metricRelabelings }}
      metricRelabelings:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.podMonitor.relabelings }}
      relabelings:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
