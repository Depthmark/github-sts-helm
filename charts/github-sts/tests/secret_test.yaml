suite: Endpoint Auth Secret
templates:
  - secret.yaml
release:
  name: test
  namespace: github-sts
tests:
  - it: should not create an endpoint auth Secret by default
    asserts:
      - hasDocuments:
          count: 0

  - it: should create a Secret with an inline health token
    set:
      endpointAuth.healthToken: health-secret
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: test-github-sts-endpoint-auth
      - equal:
          path: type
          value: Opaque
      - equal:
          path: stringData["health-auth-token"]
          value: health-secret
      - isNull:
          path: stringData["metrics-auth-token"]

  - it: should create a Secret with an inline metrics token
    set:
      endpointAuth.metricsToken: metrics-secret
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: stringData["metrics-auth-token"]
          value: metrics-secret
      - isNull:
          path: stringData["health-auth-token"]

  - it: should preserve the deprecated metrics token in the Secret
    set:
      metrics.authToken: legacy-metrics-secret
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: stringData["metrics-auth-token"]
          value: legacy-metrics-secret

  - it: should use custom keys for both inline tokens
    set:
      endpointAuth.healthKey: custom-health
      endpointAuth.metricsKey: custom-metrics
      endpointAuth.healthToken: health-secret
      endpointAuth.metricsToken: metrics-secret
    asserts:
      - equal:
          path: stringData["custom-health"]
          value: health-secret
      - equal:
          path: stringData["custom-metrics"]
          value: metrics-secret

  - it: should not create a Secret for an existing Secret reference
    set:
      endpointAuth.existingSecret: shared-endpoint-auth
      probes.mode: tcpSocket
    asserts:
      - hasDocuments:
          count: 0

  - it: should ignore inline tokens when an existing Secret is selected
    set:
      endpointAuth.existingSecret: shared-endpoint-auth
      endpointAuth.healthToken: ignored-health
      endpointAuth.metricsToken: ignored-metrics
      probes.mode: tcpSocket
    asserts:
      - hasDocuments:
          count: 0
