# CI test values: every App key held in Azure Key Vault, a flat entry and a
# pool side by side, signing as two cloud identities through one projected
# ServiceAccount token. Lint and render only: the Kind job cannot reach a
# vault, and github-sts refuses to start when a key cannot sign.
cloudIdentities:
  vault-one:
    azure:
      clientId: "00000000-0000-0000-0000-000000000001"
      tenantId: "00000000-0000-0000-0000-000000000003"
  vault-two:
    azure:
      clientId: "00000000-0000-0000-0000-000000000002"
      tenantId: "00000000-0000-0000-0000-000000000003"

github:
  apps:
    default:
      appId: 12345
      signer:
        cloudIdentity: vault-one
        keyId: "https://stsexample.vault.azure.net/keys/github-app-default"
    checkout:
      orgPolicyRepo: ".github"
      instances:
        - name: checkout-1
          appId: 111111
          signer:
            cloudIdentity: vault-one
            keyId: "https://stsexample.vault.azure.net/keys/github-app-checkout-1"
        # A second vault and identity, and a pinned key version, which the
        # server also accepts.
        - name: checkout-2
          appId: 222222
          signer:
            cloudIdentity: vault-two
            keyId: "https://stsexample2.vault.azure.net/keys/github-app-checkout-2/0123456789abcdef0123456789abcdef"

networkPolicy:
  cilium:
    enabled: true
