---
name: Integration Test

on:
  pull_request:
    branches: [main]
    paths:
      - charts/**
      - .github/workflows/integration.yml
  push:
    branches: [main]
    paths:
      - charts/**
      - .github/workflows/integration.yml
  workflow_call: {}

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  kind-integration:
    name: Kind Integration Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout helm chart
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Checkout github-sts source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: Depthmark/github-sts
          path: github-sts-src
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Create Kind cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          cluster_name: github-sts-test

      - name: Read appVersion from Chart.yaml
        id: chart
        run: |
          APP_VERSION=$(grep '^appVersion:' charts/github-sts/Chart.yaml | awk '{print $2}')
          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Building image with tag: ${APP_VERSION}"

      - name: Build and load image into Kind
        run: |
          docker build -t ghcr.io/depthmark/github-sts:${{ steps.chart.outputs.app_version }} github-sts-src/
          kind load docker-image ghcr.io/depthmark/github-sts:${{ steps.chart.outputs.app_version }} --name github-sts-test

      - name: Generate dummy RSA private key
        run: |
          openssl genrsa 2048 > /tmp/dummy-private-key.pem

      - name: Create test namespace and secret
        run: |
          kubectl create namespace github-sts-test
          kubectl create secret generic github-app-dummy-credentials \
            --namespace github-sts-test \
            --from-file=github-app-private-key=/tmp/dummy-private-key.pem

      - name: Install chart
        run: |
          helm install github-sts charts/github-sts \
            --namespace github-sts-test \
            --set github.apps.default.appId=12345 \
            --set github.apps.default.existingSecret=github-app-dummy-credentials \
            --set image.pullPolicy=Never \
            --wait \
            --timeout 120s

      - name: Verify deployment is running
        run: |
          kubectl -n github-sts-test rollout status deployment/github-sts --timeout=60s
          kubectl -n github-sts-test get pods -l app.kubernetes.io/name=github-sts

      - name: Verify pod is ready
        run: |
          POD=$(kubectl -n github-sts-test get pod -l app.kubernetes.io/name=github-sts -o jsonpath='{.items[0].metadata.name}')
          READY=$(kubectl -n github-sts-test get pod "$POD" -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}')
          echo "Pod ${POD} Ready: ${READY}"
          [ "$READY" = "True" ]

      - name: Verify configmap contents
        run: |
          CONFIG=$(kubectl -n github-sts-test get configmap github-sts-config -o jsonpath='{.data.config\.yaml}')
          echo "$CONFIG"
          echo "$CONFIG" | grep -q 'app_id: 12345'
          echo "$CONFIG" | grep -q 'port: 8080'
          echo "$CONFIG" | grep -q 'backend: "memory"'
          echo "ConfigMap validation passed"

      - name: Verify secret is mounted
        run: |
          POD=$(kubectl -n github-sts-test get pod -l app.kubernetes.io/name=github-sts -o jsonpath='{.items[0].metadata.name}')
          # Check the volume mount exists (read-only filesystem, so we check via mount info)
          kubectl -n github-sts-test get pod "$POD" -o jsonpath='{.spec.containers[0].volumeMounts[*].mountPath}' | grep -q '/etc/github-sts/apps/default'
          echo "Secret volume mount verified"

      - name: Verify service exists
        run: |
          kubectl -n github-sts-test get service github-sts
          SVC_PORT=$(kubectl -n github-sts-test get service github-sts -o jsonpath='{.spec.ports[0].port}')
          echo "Service port: ${SVC_PORT}"
          [ "$SVC_PORT" = "8080" ]

      - name: Run Helm tests (health, readiness, metrics)
        run: |
          helm test github-sts --namespace github-sts-test --timeout 60s

      - name: Verify security context
        run: |
          POD=$(kubectl -n github-sts-test get pod -l app.kubernetes.io/name=github-sts -o jsonpath='{.items[0].metadata.name}')
          RUN_AS_USER=$(kubectl -n github-sts-test get pod "$POD" -o jsonpath='{.spec.securityContext.runAsUser}')
          RUN_AS_NON_ROOT=$(kubectl -n github-sts-test get pod "$POD" -o jsonpath='{.spec.securityContext.runAsNonRoot}')
          READ_ONLY=$(kubectl -n github-sts-test get pod "$POD" -o jsonpath='{.spec.containers[0].securityContext.readOnlyRootFilesystem}')
          echo "runAsUser: ${RUN_AS_USER}, runAsNonRoot: ${RUN_AS_NON_ROOT}, readOnlyRootFilesystem: ${READ_ONLY}"
          [ "$RUN_AS_USER" = "65534" ]
          [ "$RUN_AS_NON_ROOT" = "true" ]
          [ "$READ_ONLY" = "true" ]
          echo "Security context validation passed"

      - name: Collect debug info on failure
        if: failure()
        env:
          NS: github-sts-test
          SELECTOR: app.kubernetes.io/name=github-sts
        run: |
          reason=$(kubectl -n "$NS" get pods -l "$SELECTOR" \
            -o jsonpath='{.items[0].status.containerStatuses[0].lastState.terminated.reason}')
          exit_code=$(kubectl -n "$NS" get pods -l "$SELECTOR" \
            -o jsonpath='{.items[0].status.containerStatuses[0].lastState.terminated.exitCode}')
          cause=$(kubectl -n "$NS" logs -l "$SELECTOR" --previous --tail=20 2>/dev/null \
            | grep -iE 'error|fatal|panic' | tail -1)
          if [ -n "$cause" ]; then
            echo "::error::Container exited (${reason:-unknown}, exit ${exit_code:-?}): ${cause}"
          elif [ -n "$reason" ]; then
            echo "::error::Container exited (${reason}, exit ${exit_code:-?}); see the logs below"
          fi

          echo "::group::Pod status"
          kubectl -n "$NS" get pods -o wide
          kubectl -n "$NS" get pods -l "$SELECTOR" -o jsonpath='{range .items[*]}{.metadata.name}{"  waiting="}{.status.containerStatuses[0].state.waiting.reason}{"  lastTerminated="}{.status.containerStatuses[0].lastState.terminated.reason}{"  restarts="}{.status.containerStatuses[0].restartCount}{"\n"}{end}'
          echo "::endgroup::"

          # The crashed container's own output. Both are printed because which
          # one carries the cause depends on where in the restart loop we are.
          echo "::group::Logs (previous container)"
          kubectl -n "$NS" logs -l "$SELECTOR" --previous --tail=100 --prefix 2>&1
          echo "::endgroup::"

          echo "::group::Logs (current container)"
          kubectl -n "$NS" logs -l "$SELECTOR" --tail=100 --prefix --all-containers 2>&1
          echo "::endgroup::"

          # The rendered server configuration. A chart that has drifted from
          # the server it deploys fails here, not in the templates, so this is
          # printed on every failure rather than only in the verify step.
          echo "::group::Rendered server configuration"
          kubectl -n "$NS" get configmap github-sts-config -o jsonpath='{.data.config\.yaml}'
          echo "::endgroup::"

          echo "::group::Warning events"
          kubectl -n "$NS" get events --field-selector type=Warning --sort-by=.lastTimestamp
          echo "::endgroup::"

          echo "::group::Pod describe"
          kubectl -n "$NS" describe pods -l "$SELECTOR"
          echo "::endgroup::"

          echo "::group::Helm release"
          helm status github-sts -n "$NS"
          echo "::endgroup::"

          echo "::group::All events"
          kubectl -n "$NS" get events --sort-by=.lastTimestamp
          echo "::endgroup::"

  kind-integration-tls:
    name: Kind Integration Test (TLS / mTLS)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NS: github-sts-tls-test
    steps:
      - name: Checkout helm chart
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Checkout github-sts source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: Depthmark/github-sts
          path: github-sts-src
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Create Kind cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          cluster_name: github-sts-tls-test

      - name: Read appVersion from Chart.yaml
        id: chart
        run: |
          APP_VERSION=$(grep '^appVersion:' charts/github-sts/Chart.yaml | awk '{print $2}')
          echo "app_version=${APP_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build and load image into Kind
        run: |
          docker build -t ghcr.io/depthmark/github-sts:${{ steps.chart.outputs.app_version }} github-sts-src/
          kind load docker-image ghcr.io/depthmark/github-sts:${{ steps.chart.outputs.app_version }} --name github-sts-tls-test

      - name: Generate certificate material
        run: |
          # Test CA, used both to sign the serving cert and as the client CA.
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout /tmp/ca.key -out /tmp/ca.crt -subj "/CN=github-sts-test-ca"

          # Serving certificate: SAN must cover the in-cluster Service name.
          openssl req -newkey rsa:2048 -nodes -keyout /tmp/tls.key -out /tmp/server.csr \
            -subj "/CN=github-sts"
          openssl x509 -req -in /tmp/server.csr -CA /tmp/ca.crt -CAkey /tmp/ca.key \
            -CAcreateserial -days 1 -out /tmp/tls.crt \
            -extfile <(printf "subjectAltName=DNS:github-sts,DNS:github-sts.%s.svc" "$NS")

          # Client certificate for the mTLS checks.
          openssl req -newkey rsa:2048 -nodes -keyout /tmp/client.key -out /tmp/client.csr \
            -subj "/CN=integration-client"
          openssl x509 -req -in /tmp/client.csr -CA /tmp/ca.crt -CAkey /tmp/ca.key \
            -CAcreateserial -days 1 -out /tmp/client.crt

          openssl genrsa 2048 > /tmp/dummy-private-key.pem

      - name: Create namespace and secrets
        run: |
          kubectl create namespace "$NS"
          kubectl create secret generic github-app-dummy-credentials --namespace "$NS" \
            --from-file=github-app-private-key=/tmp/dummy-private-key.pem
          kubectl create secret tls github-sts-tls --namespace "$NS" \
            --cert=/tmp/tls.crt --key=/tmp/tls.key
          kubectl create secret generic github-sts-client-ca --namespace "$NS" \
            --from-file=ca.crt=/tmp/ca.crt
          kubectl create secret generic integration-client-cert --namespace "$NS" \
            --from-file=tls.crt=/tmp/client.crt \
            --from-file=tls.key=/tmp/client.key \
            --from-file=ca.crt=/tmp/ca.crt

      - name: Install chart with TLS enabled
        run: |
          helm install github-sts charts/github-sts \
            --namespace "$NS" \
            --set github.apps.default.appId=12345 \
            --set github.apps.default.existingSecret=github-app-dummy-credentials \
            --set image.pullPolicy=Never \
            --set tls.enabled=true \
            --set tls.existingSecret=github-sts-tls \
            --set tls.reloadInterval=1h \
            --wait \
            --timeout 120s

      - name: Verify the pod serves HTTPS
        run: |
          # --wait already required Ready, which means the HTTPS readiness probe
          # succeeded against the mounted certificate.
          kubectl -n "$NS" rollout status deployment/github-sts --timeout=60s

          CONFIG=$(kubectl -n "$NS" get configmap github-sts-config -o jsonpath='{.data.config\.yaml}')
          echo "$CONFIG" | grep -q 'cert_file: "/etc/github-sts-tls/tls.crt"'
          echo "$CONFIG" | grep -q 'key_file: "/etc/github-sts-tls/tls.key"'
          echo "$CONFIG" | grep -q 'reload_interval: "1h"'
          ! echo "$CONFIG" | grep -q 'client_ca_file'

          SCHEME=$(kubectl -n "$NS" get deployment github-sts -o jsonpath='{.spec.template.spec.containers[0].readinessProbe.httpGet.scheme}')
          PORT_NAME=$(kubectl -n "$NS" get service github-sts -o jsonpath='{.spec.ports[0].name}')
          APP_PROTOCOL=$(kubectl -n "$NS" get service github-sts -o jsonpath='{.spec.ports[0].appProtocol}')
          echo "probe scheme: ${SCHEME}, port name: ${PORT_NAME}, appProtocol: ${APP_PROTOCOL}"
          [ "$SCHEME" = "HTTPS" ]
          [ "$PORT_NAME" = "https" ]
          [ "$APP_PROTOCOL" = "https" ]

      - name: Verify the served certificate chains to our CA
        run: |
          kubectl -n "$NS" apply -f - <<'EOF'
          apiVersion: v1
          kind: Pod
          metadata:
            name: tls-verify
          spec:
            restartPolicy: Never
            containers:
              - name: curl
                image: curlimages/curl:8.11.1
                args:
                  - -fsS
                  - --max-time
                  - "10"
                  - --cacert
                  - /certs/ca.crt
                  - https://github-sts:8080/health
                volumeMounts:
                  - name: client-cert
                    mountPath: /certs
                    readOnly: true
            volumes:
              - name: client-cert
                secret:
                  secretName: integration-client-cert
          EOF
          kubectl -n "$NS" wait --for=jsonpath='{.status.phase}'=Succeeded pod/tls-verify --timeout=90s
          kubectl -n "$NS" logs tls-verify | grep -q '"status"'
          echo "Server certificate verified against the test CA"

      - name: Run Helm tests over HTTPS
        run: |
          helm test github-sts --namespace "$NS" --timeout 60s

      - name: Upgrade to mutual TLS
        run: |
          helm upgrade github-sts charts/github-sts \
            --namespace "$NS" \
            --set github.apps.default.appId=12345 \
            --set github.apps.default.existingSecret=github-app-dummy-credentials \
            --set image.pullPolicy=Never \
            --set tls.enabled=true \
            --set tls.existingSecret=github-sts-tls \
            --set tls.clientAuth.enabled=true \
            --set tls.clientAuth.existingSecret=github-sts-client-ca \
            --wait \
            --timeout 120s

      - name: Verify mTLS wiring
        run: |
          CONFIG=$(kubectl -n "$NS" get configmap github-sts-config -o jsonpath='{.data.config\.yaml}')
          echo "$CONFIG" | grep -q 'client_ca_file: "/etc/github-sts-tls/ca.crt"'

          # The kubelet cannot present a client certificate, so probes must have
          # fallen back to tcpSocket — otherwise the pod would never go Ready.
          PROBE=$(kubectl -n "$NS" get deployment github-sts -o jsonpath='{.spec.template.spec.containers[0].readinessProbe.tcpSocket.port}')
          echo "readiness tcpSocket port: ${PROBE}"
          [ "$PROBE" = "https" ]

          # Test hooks are not rendered under mTLS.
          if helm get manifest github-sts --namespace "$NS" | grep -q 'test-health'; then
            echo "::error::helm test hooks should not be rendered under mTLS"
            exit 1
          fi

      - name: Verify a client without a certificate is rejected
        run: |
          if kubectl -n "$NS" run mtls-anonymous --rm -i --restart=Never \
            --image=curlimages/curl:8.11.1 --quiet --command -- \
            curl -fsSk --max-time 10 https://github-sts:8080/health; then
            echo "::error::request without a client certificate was accepted"
            exit 1
          fi
          echo "Anonymous client rejected as expected"

      - name: Verify a client with a certificate is accepted
        run: |
          kubectl -n "$NS" apply -f - <<'EOF'
          apiVersion: v1
          kind: Pod
          metadata:
            name: mtls-client
          spec:
            restartPolicy: Never
            containers:
              - name: curl
                image: curlimages/curl:8.11.1
                args:
                  - -fsS
                  - --max-time
                  - "10"
                  - --cacert
                  - /certs/ca.crt
                  - --cert
                  - /certs/tls.crt
                  - --key
                  - /certs/tls.key
                  - https://github-sts:8080/health
                volumeMounts:
                  - name: client-cert
                    mountPath: /certs
                    readOnly: true
            volumes:
              - name: client-cert
                secret:
                  secretName: integration-client-cert
          EOF
          kubectl -n "$NS" wait --for=jsonpath='{.status.phase}'=Succeeded pod/mtls-client --timeout=90s
          kubectl -n "$NS" logs mtls-client | grep -q '"status"'
          echo "Authenticated client accepted"

      - name: Collect debug info on failure
        if: failure()
        env:
          SELECTOR: app.kubernetes.io/name=github-sts
        run: |
          reason=$(kubectl -n "$NS" get pods -l "$SELECTOR" \
            -o jsonpath='{.items[0].status.containerStatuses[0].lastState.terminated.reason}')
          exit_code=$(kubectl -n "$NS" get pods -l "$SELECTOR" \
            -o jsonpath='{.items[0].status.containerStatuses[0].lastState.terminated.exitCode}')
          cause=$(kubectl -n "$NS" logs -l "$SELECTOR" --previous --tail=20 2>/dev/null \
            | grep -iE 'error|fatal|panic' | tail -1)
          if [ -n "$cause" ]; then
            echo "::error::Container exited (${reason:-unknown}, exit ${exit_code:-?}): ${cause}"
          elif [ -n "$reason" ]; then
            echo "::error::Container exited (${reason}, exit ${exit_code:-?}); see the logs below"
          fi

          echo "::group::Pod status"
          kubectl -n "$NS" get pods -o wide
          kubectl -n "$NS" get pods -l "$SELECTOR" -o jsonpath='{range .items[*]}{.metadata.name}{"  waiting="}{.status.containerStatuses[0].state.waiting.reason}{"  lastTerminated="}{.status.containerStatuses[0].lastState.terminated.reason}{"  restarts="}{.status.containerStatuses[0].restartCount}{"\n"}{end}'
          echo "::endgroup::"

          # The crashed container's own output. Both are printed because which
          # one carries the cause depends on where in the restart loop we are.
          echo "::group::Logs (previous container)"
          kubectl -n "$NS" logs -l "$SELECTOR" --previous --tail=100 --prefix 2>&1
          echo "::endgroup::"

          echo "::group::Logs (current container)"
          kubectl -n "$NS" logs -l "$SELECTOR" --tail=100 --prefix --all-containers 2>&1
          echo "::endgroup::"

          # The rendered server configuration. A chart that has drifted from
          # the server it deploys fails here, not in the templates, so this is
          # printed on every failure rather than only in the verify step.
          echo "::group::Rendered server configuration"
          kubectl -n "$NS" get configmap github-sts-config -o jsonpath='{.data.config\.yaml}'
          echo "::endgroup::"

          echo "::group::Warning events"
          kubectl -n "$NS" get events --field-selector type=Warning --sort-by=.lastTimestamp
          echo "::endgroup::"

          echo "::group::Pod describe"
          kubectl -n "$NS" describe pods -l "$SELECTOR"
          echo "::endgroup::"

          echo "::group::Helm release"
          helm status github-sts -n "$NS"
          echo "::endgroup::"

          echo "::group::All events"
          kubectl -n "$NS" get events --sort-by=.lastTimestamp
          echo "::endgroup::"
