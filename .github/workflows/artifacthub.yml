---
name: Artifact Hub Metadata

on:
  push:
    branches: [main]
    paths:
      - artifacthub-repo.yml
      - .github/workflows/artifacthub.yml
  workflow_dispatch: {}

permissions: {}

jobs:
  publish-metadata:
    name: Publish Repository Metadata
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      packages: write
    env:
      CHART_NAME: github-sts
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install oras
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push artifacthub-repo.yml
        run: |
          LOWERCASE_OWNER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          OCI_REF="ghcr.io/${LOWERCASE_OWNER}/charts/${CHART_NAME}:artifacthub.io"

          echo "Pushing artifacthub-repo.yml to ${OCI_REF}"
          oras push "${OCI_REF}" \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml

          {
            echo "## Artifact Hub metadata published"
            echo ""
            echo "**Reference:** \`${OCI_REF}\`"
          } >> "$GITHUB_STEP_SUMMARY"
